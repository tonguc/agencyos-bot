name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos
          POSTGRES_DB: agencyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Apply migrations (smoke)
        env:
          DATABASE_URL: postgresql+asyncpg://agencyos:agencyos@localhost:5432/agencyos_test
          APP_ENV: test
          AGENCYOS_API_KEY: test-key
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://agencyos:agencyos@localhost:5432/agencyos_test
          APP_ENV: test
          AGENCYOS_API_KEY: test-key
        run: pytest -v
