[pytest]
pythonpath = .
asyncio_mode = auto
# pytest-asyncio 1.3 default fixture loop scope = function;
# session-scoped async fixture (db_engine) function-scoped test'e baglanmaz -> "Task attached to different loop".
# Her ikisini de session'a alarak tum integration testleri tek event loop'unda calisir.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
